name: Code Baseline (Advisory)

on:
  pull_request:
    paths:
      - "app/**"
      - "assets/**"
      - "packages/**"
      - "plugins/**"
      - "prisma/**"
      - "scripts/**"
      - "server/**"
      - "shared/**"
      - "world-engine/**"
      - "*.d.ts"
      - ".env.example"
      - ".env.docker.example"
      - "Dockerfile*"
      - "bunfig.toml"
      - "config.example.yaml"
      - "docker-compose*.yml"
      - "nuxt.config.ts"
      - "prisma.config.ts"
      - "release-state-migration.json"
      - "tsconfig.json"
      - "uno.config.ts"
      - "vitest.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/code-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  typecheck:
    name: Typecheck (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run typecheck
        run: bun run typecheck

  test:
    name: Full tests (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run full tests
        run: bun run test -- --reporter=dot
