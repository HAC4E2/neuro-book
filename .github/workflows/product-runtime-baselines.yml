name: Product Runtime Baseline Measurement

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEURO_BOOK_SOURCE_REVISION: ${{ github.sha }}
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  measure:
    name: ${{ matrix.platform }} Measurement
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
          - platform: linux-x64-glibc
            runner: ubuntu-latest
          - platform: linux-aarch64-glibc
            runner: ubuntu-24.04-arm
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: darwin-aarch64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --linker hoisted
      - name: Measure Product Runtime Image candidate
        shell: bash
        run: bun run product:measure --output "${RUNNER_TEMP}/product-runtime-measurement-${{ matrix.platform }}.json"
      - name: Upload baseline measurement
        uses: actions/upload-artifact@v4
        with:
          name: product-runtime-measurement-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/product-runtime-measurement-${{ matrix.platform }}.json
