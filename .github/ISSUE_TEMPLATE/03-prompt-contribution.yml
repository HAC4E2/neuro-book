name: "提示词与内置 Agent 资产 / Prompts and built-in Agent assets"
description: "优化或贡献 Profile、Skill、Workflow 及其它提示词 / Improve or contribute Profiles, Skills, Workflows, and other prompts"
title: "[Prompt] "
labels:
  - "type: feature"
  - "area: agent"
  - "status: needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        此表单用于优化现有提示词，或贡献新的内置 Profile、Skill、Workflow 和其它 Agent 资产。请从真实使用场景和可观察结果出发，不需要先设计完整实现。

        Use this form to improve an existing prompt or contribute a new built-in Profile, Skill, Workflow, or other Agent asset. Start with a real use case and observable outcomes; a complete implementation design is not required.
  - type: dropdown
    id: contribution-kind
    attributes:
      label: "改动类型 / Change type"
      options:
        - "优化现有资产 / Improve an existing asset"
        - "贡献新的内置资产 / Contribute a new built-in asset"
    validations:
      required: true
  - type: dropdown
    id: asset-kind
    attributes:
      label: "资产类型 / Asset type"
      options:
        - "Profile"
        - "Skill"
        - "Workflow"
        - "其它内置 Agent 提示词 / Other built-in Agent prompt"
        - "应用其它位置的提示词 / Prompt elsewhere in the application"
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: "目标名称或路径 / Target name or path"
      description: "现有资产请填写仓库路径或名称；新资产请填写建议名称和位置 / For an existing asset, provide its repository path or name. For a new asset, provide the proposed name and location"
      placeholder: "例如 / e.g. assets/workspace/.nbook/agent/profiles/builtin/..."
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: "实际使用场景 / Real use case"
      description: "谁在什么情况下使用它？目前具体遇到了什么阻碍？ / Who uses it, in what situation, and what concrete problem exists today?"
    validations:
      required: true
  - type: textarea
    id: desired-behavior
    attributes:
      label: "期望行为 / Desired behavior"
      description: "说明改进后应产生什么可观察结果，以及哪些约束不能被破坏 / Describe the observable outcome and the constraints that must remain intact"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "方案或提示词草案 / Proposal or prompt draft"
      description: "可选。可以粘贴你有权公开贡献的草案、结构或关键片段 / Optional. Add a draft, structure, or excerpts that you have the right to contribute publicly"
  - type: textarea
    id: evaluation
    attributes:
      label: "脱敏评测样例 / Redacted evaluation examples"
      description: "可选。提供最小输入、当前结果、期望结果和判断标准；不要上传私人会话或未授权正文 / Optional. Provide minimal inputs, current and expected outputs, and evaluation criteria. Do not upload private sessions or unlicensed manuscripts"
  - type: textarea
    id: additional-context
    attributes:
      label: "补充材料 / Additional context"
      description: "可选。添加相关 Issue、Reference、截图或公开资料 / Optional. Add related issues, references, screenshots, or public material"
  - type: dropdown
    id: pr-intent
    attributes:
      label: "是否愿意把贡献整理成 PR？ / Do you plan to prepare the contribution as a PR?"
      description: "选择“愿意”后，请等待维护者授权（添加 status: claimed 标签）再开始整理，避免重复工作。 / If you plan to do so, wait for the maintainer to authorize you (by adding the status: claimed label) before preparing it, to avoid duplicate work."
      options:
        - "愿意，会等待维护者授权 / Yes, I'll wait for maintainer authorization"
        - "愿意，但需要维护者引导 / Willing, but need maintainer guidance"
        - "仅反馈，不计划整理 / Reporting only, no PR planned"
    validations:
      required: true
  - type: checkboxes
    id: content-authorization
    attributes:
      label: "内容与授权 / Content and rights"
      options:
        - label: "我确认提交的提示词、样例和资产内容由我原创，或我有权在 AGPL-3.0-only 项目中公开贡献；其中不含未获授权的第三方或私有提示词。 / I confirm that I created the submitted prompts, examples, and assets, or have the right to contribute them publicly to an AGPL-3.0-only project; they contain no unauthorized third-party or private prompts."
          required: true
  - type: checkboxes
    id: privacy-confirmation
    attributes:
      label: "隐私确认 / Privacy confirmation"
      options:
        - label: "我已删除 API Key、Token、设备码、私人会话、未授权小说正文，以及不属于本次公开贡献的私有提示词。 / I removed API keys, tokens, device codes, private sessions, unlicensed manuscripts, and private prompts that are not part of this public contribution."
          required: true
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: "重复建议 / Duplicate check"
      options:
        - label: "我搜索过现有 Issue，没有找到相同的提示词或内置资产建议。 / I searched existing issues and did not find the same prompt or built-in asset request."
          required: true
