name: "使用与安装问题 / Usage and installation question"
description: "询问安装、启动、配置或使用方法 / Ask about installation, startup, configuration, or usage"
title: "[Support] "
labels:
  - "type: support"
  - "status: needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        GitHub Issue 是公开页面。请只提供解决问题需要的最小信息，并先删除密钥、小说正文和私人会话内容。

        GitHub issues are public. Share only the minimum information needed and remove secrets, manuscript content, and private session data first.
  - type: textarea
    id: question
    attributes:
      label: "你想完成什么？ / What are you trying to do?"
      description: "说明目标和卡住的位置 / Describe the goal and where you are blocked"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "NeuroBook 版本 / Version"
      description: "Release 版本、canary tag 或 commit SHA / Release version, canary tag, or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: "安装或运行方式 / Installation or runtime method"
      options:
        - "Windows 免安装包 / Windows portable"
        - "Product Bun / Native Product"
        - "Docker 或 Podman / Docker or Podman"
        - "源码开发 / Source development"
        - "在线站点 / Hosted site"
        - "尚未安装 / Not installed yet"
        - "其它 / Other"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "平台与环境 / Platform and environment"
      placeholder: "例如 Windows 11 x64、macOS 15 ARM64、Ubuntu 24.04 Docker"
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: "已经尝试过什么？ / What have you tried?"
      description: "列出运行过的命令、查过的文档和观察到的结果 / List commands, documentation, and outcomes"
    validations:
      required: true
  - type: textarea
    id: current-result
    attributes:
      label: "当前现象 / Current result"
      description: "粘贴完整错误文字，或说明为什么现有结果无法继续 / Include the complete error or explain why you cannot continue"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "脱敏日志或截图 / Redacted logs or screenshots"
      description: "可选。请不要上传整个数据目录、配置文件或 Session Trace / Optional. Do not upload the whole data directory, configuration, or a session trace"
      render: shell
  - type: checkboxes
    id: privacy-confirmation
    attributes:
      label: "隐私确认 / Privacy confirmation"
      options:
        - label: "我已删除 API Key、Token、设备码、小说正文、完整提示词和私人会话内容。 / I removed API keys, tokens, device codes, manuscript content, full prompts, and private session data."
          required: true
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: "已有答案 / Existing answers"
      options:
        - label: "我搜索过文档和现有 Issue，仍未找到答案。 / I searched the documentation and existing issues and still could not find an answer."
          required: true
