<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <!-- 品牌成品里的图标（public/，来源见 src/ui/brand/README.md）。 -->
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="/favicon.ico" sizes="32x32" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <title>NeuroBook</title>
        <link rel="stylesheet" href="./host-loading.css" />
    </head>
    <body>
        <div id="app">
            <!-- 加载页：书名与提示由前端入口在引导给出书名后写进来（boot.ts），进度条一直在正中。 -->
            <main class="nb-host-loading" data-browser-host-status="loading" role="status" aria-label="正在启动 NeuroBook">
                <p class="nb-host-loading__title" data-host-loading-title></p>
                <div class="nb-host-loading__bar"></div>
                <p class="nb-host-loading__hint" data-host-loading-hint></p>
            </main>
        </div>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
